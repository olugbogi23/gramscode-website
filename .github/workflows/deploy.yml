name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'milestone/*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          # Copy site HTML files to _site root
          mkdir -p _site
          cp -r agencygtm.framer.website/. _site/

          # Copy image assets into _site so relative paths work
          cp -r framerusercontent.com _site/framerusercontent.com

          # Fix favicon paths: ../framerusercontent.com/ → ./framerusercontent.com/
          find _site -name "*.html" -exec sed -i 's|../framerusercontent.com/|./framerusercontent.com/|g' {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
