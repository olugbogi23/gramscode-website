name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'milestone/*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          # Copy HTML pages to root
          cp -r agencygtm.framer.website/. _site/
          # Copy all local assets (images + downloaded mjs modules)
          cp -r framerusercontent.com _site/framerusercontent.com
          # Fix favicon paths: ../framerusercontent.com/ → ./framerusercontent.com/
          find _site -maxdepth 1 -name "*.html" -exec sed -i 's|../framerusercontent.com/|./framerusercontent.com/|g' {} +
          # blogs/ and case-studies/ subfolders: ../../framerusercontent.com/ → ../framerusercontent.com/
          find _site/blogs _site/case-studies -name "*.html" -exec sed -i 's|../../framerusercontent.com/|../framerusercontent.com/|g' {} + 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
